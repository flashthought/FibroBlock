# ---------------------------------------------------------------------------
# FibroBlock — package metadata and tool configuration.
#
# The package is laid out src/-style (src/fibroblock/) so that tests import the
# INSTALLED package rather than accidentally picking up the working directory.
# That is what makes "pip install -e . && pytest" behave the same on the
# examiner's machine as on mine.
# ---------------------------------------------------------------------------

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fibroblock"
version = "1.0.0"
description = "Cardiac action-potential propagation and conduction block in a 1-D monodomain FitzHugh-Nagumo strand"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "FibroBlock author", email = "author@example.com" },
]
keywords = [
    "cardiac electrophysiology",
    "monodomain",
    "FitzHugh-Nagumo",
    "conduction block",
    "reaction-diffusion",
    "finite differences",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Physics",
]

# Runtime dependencies. Exact pins live in requirements.txt; here we state only
# the lower bounds needed for the API features we actually use, so that the
# package remains installable inside a conda environment that resolved slightly
# different patch versions.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
    "black>=24.0",
    "jupyter>=1.0",
]

[project.urls]
Repository = "https://github.com/REPLACE-ME/FibroBlock"

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
# -ra shows a summary line for every non-passing test, including skips. The
# deliverables checklist requires "pytest passes with NO SKIPS", so we want any
# skip to be loudly visible rather than hidden in the dot output.
addopts = "-ra --strict-markers"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# ---------------------------------------------------------------------------
# black — code formatting
# ---------------------------------------------------------------------------
[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'

# ---------------------------------------------------------------------------
# ruff — linting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests", "experiments", "scripts"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import ordering)
    "N",    # pep8-naming
    "D",    # pydocstyle (we require docstrings everywhere)
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "NPY",  # NumPy-specific rules
]
ignore = [
    # Mathematical code legitimately uses single-capital names such as V, D, J
    # to match the equations in the report. Renaming them to "voltage" or
    # "diffusion_coefficient" everywhere would make the code HARDER to check
    # against the derivation, which is the opposite of what we want.
    "N803",  # argument name should be lowercase
    "N806",  # variable in function should be lowercase
    # D203/D213 conflict with the numpy docstring convention selected below.
    "D203",
    "D213",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# Experiment scripts and tests are allowed slightly looser docstring rules on
# module-internal helpers; the public library in src/ is held to the full bar.
"tests/*" = ["D100", "D103"]
"experiments/*" = ["D100"]
"scripts/*" = ["D100"]
